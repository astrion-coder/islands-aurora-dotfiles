; cava for the island's audio visualizer (services/Spectrum.qml): 24 bars from the
; default output, printed as numbers 0-100 per line.

[general]
framerate = 60
bars = 24
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
